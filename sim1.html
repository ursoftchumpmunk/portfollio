<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>🏀⚡ Super Neon Basketball Court Simulator!</title>
  <!-- Tailwind CSS for responsive layout -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Playful Elementary School Poster Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bungee&family=Comic+Neue:ital,wght@0,700;1,700&family=Fredoka:wght@500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --purple-main: #8b16e9;
      --lime-green: #9eca35;
      --violet-bright: #af12ed;
      --hot-pink: #ee117b;
      --mint-neon: #10ef83;
      --ink-dark: #180429;
    }

    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: 'Fredoka', 'Comic Neue', cursive, sans-serif;
      background-color: #160526;
      background-image:
        radial-gradient(circle at 50% 45%, rgba(175, 18, 237, 0.28) 0%, rgba(22, 5, 38, 0.96) 85%),
        linear-gradient(rgba(16, 239, 131, 0.14) 2px, transparent 2px),
        linear-gradient(90deg, rgba(158, 202, 53, 0.14) 2px, transparent 2px);
      background-size: 100% 100%, 34px 34px, 34px 34px;
      color: var(--ink-dark);
      overflow-x: hidden;
      min-height: 100vh;
    }

    .font-poster {
      font-family: 'Bungee', 'Fredoka', cursive;
      letter-spacing: 0.03em;
    }

    .font-comic {
      font-family: 'Comic Neue', 'Fredoka', cursive;
    }

    /* Chunky Kid-Poster Borders & Shadows */
    .kid-card {
      border: 4px solid var(--ink-dark);
      border-radius: 26px;
      box-shadow: 7px 7px 0px var(--ink-dark);
    }

    .kid-btn {
      border: 4px solid var(--ink-dark);
      border-radius: 20px;
      box-shadow: 5px 5px 0px var(--ink-dark);
      font-weight: 700;
      cursor: pointer;
      user-select: none;
      transition: transform 0.14s cubic-bezier(0.34, 1.56, 0.64, 1), box-shadow 0.14s ease, filter 0.14s ease;
    }

    .kid-btn:hover {
      transform: translate(-2px, -2px) scale(1.03);
      box-shadow: 7px 7px 0px var(--ink-dark);
      filter: brightness(1.06);
    }

    .kid-btn:active {
      transform: translate(3px, 3px) scale(0.97);
      box-shadow: 2px 2px 0px var(--ink-dark);
    }

    /* =========================================================
       ROAMING LAVA CORNER EFFECTS
       ========================================================= */
    .lava-corner {
      position: fixed;
      width: 230px;
      height: 230px;
      pointer-events: none;
      z-index: 1;
      opacity: 0.88;
      filter: drop-shadow(0 0 18px rgba(238, 17, 123, 0.72));
    }

    .lava-tl { top: -35px; left: -35px; }
    .lava-tr { top: -35px; right: -35px; transform: scaleX(-1); }
    .lava-bl { bottom: -35px; left: -35px; transform: scaleY(-1); }
    .lava-br { bottom: -35px; right: -35px; transform: scale(-1, -1); }

    @keyframes lavaRoamA {
      0%, 100% { transform: translate(0px, 0px) scale(1) rotate(0deg); }
      33% { transform: translate(24px, 14px) scale(1.12) rotate(8deg); }
      66% { transform: translate(10px, 28px) scale(0.94) rotate(-6deg); }
    }

    @keyframes lavaRoamB {
      0%, 100% { transform: translate(0px, 0px) scale(1); }
      50% { transform: translate(34px, 20px) scale(1.2); }
    }

    @keyframes lavaBubble {
      0%, 100% { transform: translateY(0) scale(1); opacity: 0.9; }
      50% { transform: translateY(-18px) scale(1.18); opacity: 1; }
    }

    .lava-blob-1 { animation: lavaRoamA 7s ease-in-out infinite; transform-origin: center; }
    .lava-blob-2 { animation: lavaRoamB 5.5s ease-in-out infinite; transform-origin: center; }
    .lava-bubble { animation: lavaBubble 3.4s ease-in-out infinite; transform-origin: center; }

    /* =========================================================
       CRACKLING THUNDER / LIGHTNING EFFECTS
       ========================================================= */
    .thunder-bolt {
      position: fixed;
      pointer-events: none;
      z-index: 2;
      opacity: 0;
      filter: drop-shadow(0 0 12px #10ef83) drop-shadow(0 0 24px #9eca35);
    }

    @keyframes thunderFlash {
      0%, 88%, 100% { opacity: 0; transform: scale(0.95); }
      90% { opacity: 1; transform: scale(1.06); }
      92% { opacity: 0.2; }
      94% { opacity: 1; transform: scale(1.02); }
      97% { opacity: 0; }
    }

    .thunder-1 { top: 10px; left: 10px; animation: thunderFlash 5.1s infinite; }
    .thunder-2 { top: 12px; right: 14px; animation: thunderFlash 6.5s infinite 2.0s; }
    .thunder-3 { bottom: 14px; left: 16px; animation: thunderFlash 7.2s infinite 3.5s; }
    .thunder-4 { bottom: 12px; right: 12px; animation: thunderFlash 5.8s infinite 1.1s; }

    .screen-zap {
      animation: screenZapFlash 0.35s ease-out;
    }

    @keyframes screenZapFlash {
      0% { box-shadow: inset 0 0 95px #10ef83, inset 0 0 150px #af12ed; }
      100% { box-shadow: inset 0 0 0px transparent; }
    }

    @keyframes stickerWiggle {
      0%, 100% { transform: rotate(-2deg); }
      50% { transform: rotate(2deg); }
    }

    .sticker-wiggle {
      animation: stickerWiggle 3s ease-in-out infinite;
    }

    @keyframes popIn {
      0% { transform: translate(-50%, -50%) scale(0.5); opacity: 0; }
      75% { transform: translate(-50%, -50%) scale(1.08); opacity: 1; }
      100% { transform: translate(-50%, -50%) scale(1); opacity: 1; }
    }

    .ball-menu-pop {
      animation: popIn 0.2s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
    }

    canvas {
      display: block;
      width: 100%;
      height: 100%;
      touch-action: manipulation;
    }
  </style>
</head>

  <!-- =========================================================
       JAVASCRIPT: COURT PHYSICS, SHOT TIMING METER, PASS & SOUND

  <script>
    /**
     * 1. SOUND SYNTHESIZER (WEB AUDIO API - NO EXTERNAL FILES)
     */
    let audioCtx = null;
    let soundEnabled = true;

    function initAudio() {
      if (!audioCtx) {
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        if (AudioCtx) audioCtx = new AudioCtx();
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
    }

    function playSound(type) {
      if (!soundEnabled) return;
      try {
        initAudio();
        if (!audioCtx) return;
        const now = audioCtx.currentTime;

        if (type === 'dribble') {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sine';
          osc.frequency.setValueAtTime(165, now);
          osc.frequency.exponentialRampToValueAtTime(55, now + 0.11);
          gain.gain.setValueAtTime(0.35, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + 0.13);
        } else if (type === 'pass') {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(320, now);
          osc.frequency.exponentialRampToValueAtTime(640, now + 0.14);
          gain.gain.setValueAtTime(0.22, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + 0.16);
        } else if (type === 'green') {
          [523.25, 659.25, 783.99, 1046.5].forEach((freq, idx) => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(freq, now + idx * 0.03);
            gain.gain.setValueAtTime(0.18, now + idx * 0.03);
            gain.gain.exponentialRampToValueAtTime(0.001, now + 0.42);
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            osc.start(now + idx * 0.03);
            osc.stop(now + 0.45);
          });
        } else if (type === 'swish') {
          const bufferSize = audioCtx.sampleRate * 0.22;
          const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
          const data = buffer.getChannelData(0);
          for (let i = 0; i < bufferSize; i++) {
            data[i] = (Math.random() * 2 - 1) * Math.exp(-i / (bufferSize * 0.35));
          }
          const noise = audioCtx.createBufferSource();
          noise.buffer = buffer;
          const filter = audioCtx.createBiquadFilter();
          filter.type = 'bandpass';
          filter.frequency.value = 2600;
          const gain = audioCtx.createGain();
          gain.gain.setValueAtTime(0.35, now);
          gain.gain.exponentialRampToValueAtTime(0.01, now + 0.21);
          noise.connect(filter);
          filter.connect(gain);
          gain.connect(audioCtx.destination);
          noise.start(now);
        } else if (type === 'miss') {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(190, now);
          osc.frequency.linearRampToValueAtTime(110, now + 0.22);
          gain.gain.setValueAtTime(0.2, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.23);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + 0.24);
        } else if (type === 'zap') {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(720, now);
          osc.frequency.exponentialRampToValueAtTime(150, now + 0.14);
          gain.gain.setValueAtTime(0.16, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + 0.16);
        } else if (type === 'ankle') {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(620, now);
          osc.frequency.exponentialRampToValueAtTime(95, now + 0.34);
          gain.gain.setValueAtTime(0.28, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.36);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + 0.37);
        } else if (type === 'dunk') {
          const osc = audioCtx.createOscillator();
          const gain = audioCtx.createGain();
          osc.type = 'triangle';
          osc.frequency.setValueAtTime(150, now);
          osc.frequency.exponentialRampToValueAtTime(34, now + 0.28);
          gain.gain.setValueAtTime(0.5, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.3);
          osc.connect(gain);
          gain.connect(audioCtx.destination);
          osc.start(now);
          osc.stop(now + 0.31);
        }
      } catch (e) {
        // Safe audio fallback
      }
    }

    function resizeCanvas() {

      game.width = rect.width;
      game.height = rect.height;

      canvas.height = Math.floor(rect.height * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

    function updateScoreboard() {
      document.getElementById('score-display').textContent = game.score;

      const banner = document.getElementById('court-call-banner');
      banner.textContent = text;
      banner.style.backgroundColor = bgColor;
      banner.style.color = textColor;
    }

    function spawnBurstParticles(normX, normY, colors, count = 26) {
      const px = normX * game.width;
      const py = normY * game.height;
      for (let i = 0; i < count; i++) {
        const angle = (Math.PI * 2 * i) / count + (Math.random() - 0.5) * 0.4;
        const speed = 75 + Math.random() * 195;
        game.particles.push({
          x: px,
          y: py,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 45,
          size: 5 + Math.random() * 6,
          color: colors[i % colors.length],
          life: 0.65 + Math.random() * 0.45,
          maxLife: 1.0
        });
      }
    }

    function spawnFloatingText(normX, normY, text, color = '#10ef83') {
      game.floatingTexts.push({
        x: normX * game.width,
        y: normY * game.height,
        text,
        color,
        life: 1.45,
        maxLife: 1.45
      });
    }

      return (
        game.player.x >= 0.37 &&
        game.player.x <= 0.63 &&
        game.player.y >= 0.22 &&

      const by = (game.ball.y * game.height) - game.ball.z;
      const clampedX = Math.max(125, Math.min(game.width - 125, bx));
      const clampedY = Math.max(135, Math.min(game.height - 135, by - 45));
      radialMenu.style.left = `${clampedX}px`;
      radialMenu.style.top = `${clampedY}px`;
      radialMenu.classList.remove('hidden');

      radialMenu.classList.add('hidden');

      if (game.ball.state !== 'idle' && game.ball.state !== 'dribbling') return;

      const spot = COURT_SPOTS[index];

      game.player.targetY = spot.y;
      game.player.hasTarget = true;
      hideBallMenu();

      document.querySelectorAll('.spot-btn').forEach((btn, idx) => {
        if (idx === index) {
          btn.classList.remove('bg-white');
          btn.classList.add('bg-[#10ef83]');
        } else {
          btn.classList.remove('bg-[#10ef83]');
          btn.classList.add('bg-white');

    /**
     * 4. DRIBBLE MOVES & ANKLE BREAKER COMBO ENGINE
     * - Crossover (Key Q)
     * - Between the Legs (Key C)
     * - Behind the Back (Key X)
     * - Combo 1: Between the Legs (C) -> Crossover (Q) = 25% Ankle Breaker!
     * - Combo 2: Double Behind the Back (X -> X) = 25% Ankle Breaker!
     */
    function triggerDribbleMove(moveType) {
      if (game.ball.state !== 'idle' && game.ball.state !== 'dribbling') return;

      hideBallMenu();
      game.ball.state = 'dribbling';
      game.ball.z = 26;
      game.ball.vz = -180;
      game.player.dribbleCombo += 1;
      game.player.activeMove = moveType;
      game.player.moveProgress = 0;
      playSound('dribble');

      const now = performance.now();
      game.dribbleHistory.push({ move: moveType, time: now });
      if (game.dribbleHistory.length > 4) {
        game.dribbleHistory.shift();
      }

      const comboPill = document.getElementById('combo-tracker-pill');
      const labels = {
        'crossover': '⚡ CROSSOVER [Q]',
        'between-legs': '🦵 BETWEEN LEGS [C]',
        'behind-back': '🔄 BEHIND BACK [X]'
      };
      comboPill.textContent = `⚡ MOVE: ${labels[moveType]}`;

      spawnBurstParticles(game.player.x, game.player.y - 0.02, ['#9eca35', '#10ef83', '#af12ed'], 10);

      // Check Combo Conditions (within 2.6 seconds)
      let isAnkleCombo = false;
      let comboName = '';
      if (game.dribbleHistory.length >= 2) {
        const prev = game.dribbleHistory[game.dribbleHistory.length - 2];
        const curr = game.dribbleHistory[game.dribbleHistory.length - 1];
        if (curr.time - prev.time <= 2600) {
          if (prev.move === 'between-legs' && curr.move === 'crossover') {
            isAnkleCombo = true;
            comboName = 'BETWEEN-THE-LEGS ➔ CROSSOVER';
          } else if (prev.move === 'behind-back' && curr.move === 'behind-back') {
            isAnkleCombo = true;
            comboName = 'DOUBLE BEHIND-THE-BACK';
          }
        }
      }

      if (isAnkleCombo) {
        comboPill.textContent = `🔥 COMBO: ${comboName}!`;
        if (game.opponent.active && game.opponent.stunnedTimer <= 0) {
          // 25% CHANCE TO BREAK LEBRON'S ANKLES AND STUN HIM ON THE GROUND!
          if (Math.random() < 0.25) {
            game.opponent.stunnedTimer = 3.4;
            game.opponent.stunReason = 'ANKLES BROKEN! 💫';
            game.dribbleHistory = [];
            playSound('ankle');
            spawnBurstParticles(game.opponent.x, game.opponent.y, ['#ee117b', '#10ef83', '#9eca35'], 32);
            spawnFloatingText(game.opponent.x, game.opponent.y - 0.14, '💀 ANKLE BREAKER!! LEBRON STUNNED!!', '#10ef83');
            setBanner(`💀 ${comboName} BROKE LEBRON'S ANKLES!! HE'S STUNNED ON THE FLOOR!`, '#ee117b', '#ffffff');
            return;
          } else {
            spawnFloatingText(game.player.x, game.player.y - 0.13, `🔥 ${comboName}!`, '#9eca35');
            setBanner(`🔥 SICK ${comboName}! LEBRON BARELY STAYED UP!`, '#8b16e9', '#10ef83');
            return;
          }
        }
      }

      const moveCallouts = {
        'crossover': '⚡ CROSSOVER [Q]! (Chain after Between Legs [C] for Ankle Breaker!)',
        'between-legs': '🦵 BETWEEN THE LEGS [C]! (Hit Crossover [Q] next for Ankle Breaker!)',
        'behind-back': '🔄 BEHIND THE BACK [X]! (Hit [X] again for Double Behind-Back!)'
      };
      setBanner(moveCallouts[moveType], '#8b16e9', '#10ef83');
    }

     */
    function startOrReleaseShot() {
      if (game.ball.state === 'aiming') {
        releaseTimedShot();
        return;
      }

      if (game.ball.state !== 'idle' && game.ball.state !== 'dribbling') return;

      hideBallMenu();
      game.player.hasTarget = false;
      game.ball.state = 'aiming';
      game.meter.active = true;
      game.meter.pos = 0;
      game.meter.dir = 1;

      const inPaint = isPlayerInPaint();
      if (inPaint) {
        game.meter.greenStart = 0.56;
        game.meter.greenEnd = 0.84;
        setBanner('💥 PAINT DUNK METER! PRESS [E] OR TAP IN THE GREEN!', '#ee117b', '#ffffff');
      } else {
        game.meter.greenStart = 0.64;
        game.meter.greenEnd = 0.81;
        setBanner('🎯 SHOT METER ACTIVE! PRESS [E] OR TAP IN THE GREEN!', '#ee117b', '#ffffff');

      // If LeBron is active & not stunned, he immediately tries to close in & contest!

    function releaseTimedShot() {
      game.meter.active = false;
      const inGreen = game.meter.pos >= game.meter.greenStart && game.meter.pos <= game.meter.greenEnd;
      const inPaint = isPlayerInPaint();
      const distToArc = Math.hypot(game.player.x - HOOP_POS.x, game.player.y - HOOP_POS.y);
      const shotPts = inPaint ? 2 : (distToArc > 0.34 ? 3 : 2);

      // 1. CHECK IF LEBRON BLOCKS YOUR JUMP SHOT WHEN HE IS CLOSE ENOUGH!
      if (!inPaint && game.opponent.active && game.opponent.stunnedTimer <= 0) {
        const distToLebron = Math.hypot(game.player.x - game.opponent.x, game.player.y - game.opponent.y);
        if (distToLebron < 0.145) {
          game.player.jumpOffset = 22;
          game.opponent.jumpOffset = 46;
          game.opponent.blockAnimTimer = 0.95;
          game.streak = 0;
          updateScoreboard();

          game.ball.state = 'returning';
          game.ball.startX = game.opponent.x;
          game.ball.startY = game.opponent.y - 0.05;
          game.ball.endX = Math.max(0.14, game.player.x - 0.08);
          game.ball.endY = Math.min(0.84, game.player.y + 0.06);
          game.ball.flightT = 0;
          game.ball.flightDuration = 0.45;
          game.ball.arcHeight = 65;

          playSound('miss');
          spawnBurstParticles(game.opponent.x, game.opponent.y - 0.07, ['#ee117b', '#8b16e9', '#ffffff'], 24);
          spawnFloatingText(game.opponent.x, game.opponent.y - 0.16, '🚫 BLOCKED BY LEBRON JAMES!!', '#ee117b');
          setBanner('🚫 LEBRON JAMES SWATTED YOUR SHOT!! BREAK HIS ANKLES OR CREATE SPACE!', '#180429', '#ee117b');
          updateShootButtonUI();
          return;
        }
      }

      // 2. PAINT AREA DUNK LOGIC (50% CHANCE TO POSTERIZE LEBRON GUARDING YOU!)
      if (inPaint) {
        game.player.dunkStartX = game.player.x;
        game.player.dunkStartY = game.player.y;
        game.ball.state = 'dunking';
        game.ball.isDunk = true;
        game.ball.shooterType = 'player';
        game.ball.shotPoints = 2;
        game.ball.flightT = 0;
        game.ball.flightDuration = 0.56;

        const lebronGuardingPaint =
          game.opponent.active &&
          game.opponent.stunnedTimer <= 0 &&
          Math.hypot(game.player.x - game.opponent.x, game.player.y - game.opponent.y) < 0.25;

        if (lebronGuardingPaint) {
          game.opponent.jumpOffset = 38;
          game.opponent.blockAnimTimer = 0.9;
          // 50% CHANCE OF DUNKING ON LEBRON JAMES!
          if (Math.random() < 0.50) {
            game.ball.willMake = true;
            game.ball.isGreen = true;
            game.ball.isPosterDunk = true;
            game.player.greenEffectTimer = 2.4;
            playSound('green');
            spawnFloatingText(game.player.x, game.player.y - 0.15, '💥 POSTERIZER DUNK ON LEBRON!!', '#10ef83');
            setBanner('💥 POSTERIZED!! YOU JUST DUNKED RIGHT ON LEBRON JAMES!!', '#10ef83', '#180429');
          } else {
            game.ball.willMake = false;
            game.ball.isGreen = false;
            game.ball.isPosterDunk = false;
            playSound('miss');
            spawnFloatingText(game.opponent.x, game.opponent.y - 0.15, '👑 LEBRON STUFFED THE DUNK!', '#ee117b');
            setBanner('👑 LEBRON MET YOU AT THE RIM & BLOCKED THE DUNK (50/50)!', '#180429', '#ee117b');
          }
        } else {
          // Open / stunned-defender slam dunk!
          game.ball.willMake = true;
          game.ball.isGreen = inGreen;
          game.ball.isPosterDunk = false;
          if (inGreen) game.player.greenEffectTimer = 2.2;
          playSound('green');
          spawnFloatingText(game.player.x, game.player.y - 0.14, '💥 WIDE OPEN WINDMILL DUNK!!', '#10ef83');
          setBanner('💥 SLAM DUNK!! THROWING IT DOWN IN THE PAINT!', '#10ef83', '#180429');
        }

        updateShootButtonUI();
        return;
      }

      // 3. PERIMETER / MID-RANGE JUMP SHOT
      game.player.jumpOffset = 26;
      game.ball.state = 'shooting';
      game.ball.isDunk = false;
      game.ball.isPosterDunk = false;
      game.ball.shooterType = 'player';
      game.ball.shotPoints = shotPts;
      game.ball.startX = game.player.x;
      game.ball.startY = game.player.y - 0.05;
      game.ball.flightT = 0;
      game.ball.flightDuration = 0.76;
      game.ball.arcHeight = 165;
      game.ball.isGreen = inGreen;

      if (inGreen) {
        game.ball.willMake = true;
        game.ball.endX = HOOP_POS.x;
        game.ball.endY = HOOP_POS.y;
        game.player.greenEffectTimer = 2.4;
        playSound('green');
        spawnBurstParticles(game.player.x, game.player.y - 0.06, ['#10ef83', '#9eca35', '#ffffff'], 34);
        spawnFloatingText(game.player.x, game.player.y - 0.16, '💚 GREEN RELEASE!! 💚', '#10ef83');
        setBanner('💚 GREEN LIGHT!! AUTOMATIC SWISH!! 💚', '#10ef83', '#180429');
      } else {
        const luckyRoll = Math.random() < 0.22;
        game.ball.willMake = luckyRoll;
        game.ball.endX = luckyRoll ? HOOP_POS.x : HOOP_POS.x + (Math.random() > 0.5 ? 0.055 : -0.055);
        game.ball.endY = HOOP_POS.y + (luckyRoll ? 0 : 0.015);
        playSound('pass');
        const timingHint = game.meter.pos < game.meter.greenStart ? '⚠️ SLIGHTLY EARLY!' : '⚠️ SLIGHTLY LATE!';
        spawnFloatingText(game.player.x, game.player.y - 0.14, timingHint, '#ee117b');
        setBanner(`${timingHint} AIM FOR THE GREEN BAR!`, '#8b16e9', '#ffffff');
      }

      updateShootButtonUI();
    }

      playSound('pass');
      spawnFloatingText(CORNER_SPOT.x - 0.03, CORNER_SPOT.y - 0.13, '🙌 CURRY CATCHES • WADE HANDS UP!', '#10ef83');
      setBanner('↗️ ZIP PASS TO STEPHEN CURRY! DWYANE WADE PUTS HIS HANDS UP!', '#10ef83', '#180429');
    }

    function launchCornerShot() {
      game.cornerPlayer.jumpOffset = 28;
      game.wade.handsUpTimer = 1.8;
      game.wade.jumpOffset = 32;

      game.ball.state = 'shooting';
      game.ball.isDunk = false;
      game.ball.isPosterDunk = false;
      game.ball.shooterType = 'corner';
      game.ball.shotPoints = 3;
      game.ball.startX = CORNER_SPOT.x;
      game.ball.startY = CORNER_SPOT.y - 0.05;
      game.ball.flightT = 0;
      game.ball.curryBlocked = false;

      // Exact probabilities:
      // - 25% chance Dwyane Wade blocks Stephen Curry's shot
      // - 50% chance Stephen Curry makes the green corner 3
      // - 25% chance contested miss off the rim
      const roll = Math.random();
      const wadeBlocksShot = roll < 0.25;
      const curryMakesShot = roll >= 0.25 && roll < 0.75;

      if (wadeBlocksShot) {
        // 25% CHANCE: DWYANE WADE BLOCKS STEPHEN CURRY'S SHOT!
        game.cornerPlayer.greenEffectTimer = 0;
        game.wade.blockAnimTimer = 1.1;
        game.ball.curryBlocked = true;
        game.ball.willMake = false;
        game.ball.isGreen = false;
        game.ball.endX = game.wade.x;
        game.ball.endY = game.wade.y - 0.06;
        game.ball.arcHeight = 42;
        game.ball.flightDuration = 0.30;

        playSound('pass');
        spawnFloatingText(game.wade.x - 0.03, game.wade.y - 0.17, '🔥 D-WADE HANDS UP FOR THE BLOCK!!', '#ee117b');
        setBanner('🔥 DWYANE WADE PUTS HIS HANDS UP & BLOCKS CURRY (25%)!!', '#8b16e9', '#ee117b');
      } else if (curryMakesShot) {
        // 50% CHANCE: STEPHEN CURRY SPLASHES THE GREEN CORNER 3!
        game.cornerPlayer.greenEffectTimer = 2.5;
        game.ball.endX = HOOP_POS.x;
        game.ball.endY = HOOP_POS.y;
        game.ball.arcHeight = 175;
        game.ball.flightDuration = 0.78;
        game.ball.willMake = true;
        game.ball.isGreen = true;

        playSound('green');
        spawnBurstParticles(CORNER_SPOT.x, CORNER_SPOT.y - 0.06, ['#10ef83', '#9eca35', '#ffffff'], 36);
        spawnFloatingText(CORNER_SPOT.x - 0.04, CORNER_SPOT.y - 0.18, '💚 CURRY GREEN 3 OVER WADE!! 💚', '#10ef83');
        setBanner('💚 STEPHEN CURRY SPLASHES THE 3 OVER D-WADE (50% HIT)!! 💚', '#10ef83', '#180429');
      } else {
        // 25% REMAINING CHANCE: CONTESTED RIM MISS
        game.cornerPlayer.greenEffectTimer = 0;
        game.ball.endX = HOOP_POS.x + 0.055;
        game.ball.endY = HOOP_POS.y + 0.015;
        game.ball.arcHeight = 175;
        game.ball.flightDuration = 0.78;
        game.ball.willMake = false;
        game.ball.isGreen = false;

        playSound('pass');
        spawnFloatingText(CORNER_SPOT.x - 0.04, CORNER_SPOT.y - 0.18, '😬 CURRY CONTESTED BY WADE...', '#ee117b');
        setBanner('😬 D-WADE CONTESTED WITH HANDS UP — CURRY SHOT RIMMED OUT!', '#8b16e9', '#ee117b');
      }
    }

    /**
     * 6. MAIN SIMULATION UPDATE LOOP (INCLUDES WASD/ARROW MOVEMENT & LEBRON AI)
     */
    function update(dt) {
      // A. Player Movement (WASD / Arrow Keys or Click-to-Walk Target)
      const canMove = game.ball.state === 'idle' || game.ball.state === 'dribbling';
      if (canMove) {
        let moveX = 0;
        let moveY = 0;
        if (keysPressed['KeyW'] || keysPressed['ArrowUp']) moveY -= 1;
        if (keysPressed['KeyS'] || keysPressed['ArrowDown']) moveY += 1;
        if (keysPressed['KeyA'] || keysPressed['ArrowLeft']) moveX -= 1;
        if (keysPressed['KeyD'] || keysPressed['ArrowRight']) moveX += 1;

        if (moveX !== 0 || moveY !== 0) {
          game.player.hasTarget = false;
          const len = Math.hypot(moveX, moveY);
          const speed = 0.34;
          game.player.x = Math.max(0.12, Math.min(0.88, game.player.x + (moveX / len) * speed * dt));
          game.player.y = Math.max(0.24, Math.min(0.87, game.player.y + (moveY / len) * speed * dt));
          hideBallMenu();
          updateShootButtonUI();
        } else if (game.player.hasTarget) {
          const dx = game.player.targetX - game.player.x;
          const dy = game.player.targetY - game.player.y;
          const dist = Math.hypot(dx, dy);
          if (dist < 0.01) {
            game.player.x = game.player.targetX;
            game.player.y = game.player.targetY;
            game.player.hasTarget = false;
          } else {
            const speed = 0.36;
            game.player.x += (dx / dist) * speed * dt;
            game.player.y += (dy / dist) * speed * dt;
          }
          updateShootButtonUI();
        }
      }

      // B. LeBron James Defender AI
      if (game.opponent.active) {
        if (game.opponent.stunnedTimer > 0) {
          game.opponent.stunnedTimer = Math.max(0, game.opponent.stunnedTimer - dt);
        } else if (game.ball.state !== 'dunking') {
          // Position between player and the hoop; lunge closer when player is aiming!
          const isContesting = game.ball.state === 'aiming';
          const guardBias = isContesting ? 0.14 : 0.25;
          const guardX = game.player.x + (HOOP_POS.x - game.player.x) * guardBias;
          const guardY = game.player.y + (HOOP_POS.y - game.player.y) * guardBias;
          const chaseSpeed = isContesting ? 6.2 : 3.2;
          game.opponent.x += (guardX - game.opponent.x) * Math.min(1, dt * chaseSpeed);
          game.opponent.y += (guardY - game.opponent.y) * Math.min(1, dt * chaseSpeed);
        }

        if (game.opponent.jumpOffset > 0) {
          game.opponent.jumpOffset = Math.max(0, game.opponent.jumpOffset - dt * 65);
        }
        if (game.opponent.blockAnimTimer > 0) {
          game.opponent.blockAnimTimer = Math.max(0, game.opponent.blockAnimTimer - dt);
        }
      }

      // Dwyane Wade (Corner Defender) Animation Timers
      if (game.wade.jumpOffset > 0) {
        game.wade.jumpOffset = Math.max(0, game.wade.jumpOffset - dt * 55);
      }
      if (game.wade.handsUpTimer > 0) {
        game.wade.handsUpTimer = Math.max(0, game.wade.handsUpTimer - dt);
      }
      if (game.wade.blockAnimTimer > 0) {
        game.wade.blockAnimTimer = Math.max(0, game.wade.blockAnimTimer - dt);
      }

      // C. Gravity recovery for jumps & move progress
      if (game.player.jumpOffset > 0 && game.ball.state !== 'dunking') {
        game.player.jumpOffset = Math.max(0, game.player.jumpOffset - dt * 55);
      }
      if (game.cornerPlayer.jumpOffset > 0) {
        game.cornerPlayer.jumpOffset = Math.max(0, game.cornerPlayer.jumpOffset - dt * 55);
      }
      if (game.player.greenEffectTimer > 0) {
        game.player.greenEffectTimer = Math.max(0, game.player.greenEffectTimer - dt);
      }
      if (game.cornerPlayer.greenEffectTimer > 0) {
        game.cornerPlayer.greenEffectTimer = Math.max(0, game.cornerPlayer.greenEffectTimer - dt);
      }
      if (game.cornerPlayer.callingTimer > 0) {
        game.cornerPlayer.callingTimer = Math.max(0, game.cornerPlayer.callingTimer - dt);
      }
      if (game.player.activeMove !== 'none') {
        game.player.moveProgress += dt * 3.2;
        if (game.player.moveProgress >= 1) {
          game.player.activeMove = 'none';
          game.player.moveProgress = 0;
        }
      }

      // D. Shot Timing Meter Oscillation
      if (game.meter.active) {
        game.meter.pos += game.meter.dir * game.meter.speed * dt;
        if (game.meter.pos >= 1) {
          game.meter.pos = 1;
          game.meter.dir = -1;
        } else if (game.meter.pos <= 0) {
          game.meter.pos = 0;
          game.meter.dir = 1;
        }
      }

      // E. Ball & Dunk Physics State Machine
      const b = game.ball;
      if (b.state === 'idle' || b.state === 'aiming') {
        b.x = game.player.x + 0.025;
        b.y = game.player.y + 0.01;
        b.z = 16 + Math.sin(performance.now() * 0.005) * 3;
      } else if (b.state === 'dribbling') {
        // Custom offset animations for Crossover, Between the Legs, and Behind the Back
        const p = game.player.moveProgress;
        let offsetX = 0.025;
        let offsetY = 0.01;
        if (game.player.activeMove === 'crossover') {
          offsetX = Math.cos(p * Math.PI) * 0.045;
          offsetY = 0.015;
        } else if (game.player.activeMove === 'between-legs') {
          offsetX = Math.sin(p * Math.PI * 2) * 0.032;
          offsetY = 0.002;
        } else if (game.player.activeMove === 'behind-back') {
          offsetX = Math.cos(p * Math.PI) * 0.04;
          offsetY = -0.018;
        }

        b.x = game.player.x + offsetX;
        b.y = game.player.y + offsetY;
        b.z += b.vz * dt;
        b.vz -= 980 * dt;
        if (b.z <= 0) {
          b.z = 0;
          b.vz = 265;
          playSound('dribble');
        }
      } else if (b.state === 'dunking') {
        b.flightT += dt / b.flightDuration;
        const t = Math.min(1, b.flightT);
        game.player.x = game.player.dunkStartX + (HOOP_POS.x - game.player.dunkStartX) * t;
        game.player.y = game.player.dunkStartY + ((HOOP_POS.y + 0.07) - game.player.dunkStartY) * t;
        game.player.jumpOffset = Math.sin(t * Math.PI) * 78;

        b.x = game.player.x;
        b.y = game.player.y - 0.03;
        b.z = game.player.jumpOffset + 24;

        if (t >= 1) {
          if (b.willMake) {
            game.score += 2;
            game.streak += 1;
            if (b.isGreen) game.greens += 1;
            updateScoreboard();

            if (b.isPosterDunk) {
              game.opponent.stunnedTimer = 3.2;
              game.opponent.stunReason = 'POSTERIZED!! 💥';
              spawnBurstParticles(HOOP_POS.x, HOOP_POS.y, ['#10ef83', '#ee117b', '#9eca35'], 44);
            } else {
              spawnBurstParticles(HOOP_POS.x, HOOP_POS.y, ['#10ef83', '#9eca35', '#af12ed'], 30);
            }
            playSound('dunk');
            setBanner(
              b.isPosterDunk ? '💥 POSTER DUNK +2 PTS! LEBRON IS ON THE FLOOR!' : '💥 SLAM DUNK +2 PTS! RIM SHAKER!',
              '#10ef83',
              '#180429'
            );
          } else {
            game.streak = 0;
            updateScoreboard();
            playSound('miss');
            spawnBurstParticles(HOOP_POS.x, HOOP_POS.y, ['#ee117b', '#8b16e9'], 18);
          }

          // Land back cleanly in the paint
          game.player.x = 0.50;
          game.player.y = 0.43;
          game.player.jumpOffset = 0;
          b.isDunk = false;
          b.isPosterDunk = false;
          b.state = 'returning';
          b.startX = HOOP_POS.x;
          b.startY = HOOP_POS.y + 0.02;
          b.endX = game.player.x + 0.025;
          b.endY = game.player.y + 0.01;
          b.flightT = 0;
          b.flightDuration = 0.42;
          b.arcHeight = 35;
          updateShootButtonUI();
        }
      } else if (b.state === 'passing') {
        b.flightT += dt / b.flightDuration;
        const t = Math.min(1, b.flightT);
        b.x = b.startX + (b.endX - b.startX) * t;
        b.y = b.startY + (b.endY - b.startY) * t;
        b.z = Math.sin(t * Math.PI) * b.arcHeight + 18;

        if (t >= 1) {
          launchCornerShot();
        }
      } else if (b.state === 'shooting') {
        b.flightT += dt / b.flightDuration;
        const t = Math.min(1, b.flightT);
        b.x = b.startX + (b.endX - b.startX) * t;
        b.y = b.startY + (b.endY - b.startY) * t;
        b.z = Math.sin(t * Math.PI) * b.arcHeight + (1 - t) * 28;

        if (t >= 1) {
          if (b.curryBlocked) {
            // Dwyane Wade swatted Stephen Curry's corner 3!
            game.streak = 0;
            updateScoreboard();
            playSound('miss');
            spawnBurstParticles(game.wade.x, game.wade.y - 0.07, ['#ee117b', '#8b16e9', '#ffffff'], 24);
            b.curryBlocked = false;
          } else if (b.willMake) {
            game.score += b.shotPoints;
            game.streak += 1;
            if (b.isGreen) game.greens += 1;
            updateScoreboard();
            playSound('swish');
            spawnBurstParticles(HOOP_POS.x, HOOP_POS.y, ['#10ef83', '#9eca35', '#ee117b'], 34);
            spawnFloatingText(HOOP_POS.x, HOOP_POS.y - 0.06, `+${b.shotPoints} SWISH!! 🔥`, '#10ef83');
            setBanner(
              b.shooterType === 'corner'
                ? '💚 CURRY SPLASHES THE GREEN CORNER 3 OVER D-WADE (+3 PTS)!! 💚'
                : `🔥 BUCKET!! +${b.shotPoints} POINTS!`,
              '#10ef83',
              '#180429'
            );
          } else {
            game.streak = 0;
            updateScoreboard();
            playSound('miss');
            spawnBurstParticles(b.endX, b.endY, ['#ee117b', '#8b16e9'], 14);
            spawnFloatingText(b.endX, b.endY - 0.05, 'CLANG! RIM OUT', '#ee117b');
          }

          b.state = 'returning';
          b.startX = b.endX;
          b.startY = b.endY + 0.02;
          b.endX = game.player.x + 0.025;
          b.endY = game.player.y + 0.01;
          b.flightT = 0;
          b.flightDuration = 0.48;
          b.arcHeight = 45;
        }
      } else if (b.state === 'returning') {
        b.flightT += dt / b.flightDuration;
        const t = Math.min(1, b.flightT);
        b.x = b.startX + (b.endX - b.startX) * t;
        b.y = b.startY + (b.endY - b.startY) * t;
        b.z = Math.sin(t * Math.PI) * b.arcHeight + 16;

        if (t >= 1) {
          b.state = 'idle';
          playSound('dribble');
          updateShootButtonUI();
        }
      }

      // F. Update Particles & Floating Callout Texts
      for (let i = game.particles.length - 1; i >= 0; i--) {
        const p = game.particles[i];
        p.x += p.vx * dt;
        p.y += p.vy * dt;
        p.vy += 320 * dt;
        p.life -= dt;
        if (p.life <= 0) game.particles.splice(i, 1);
      }

      for (let i = game.floatingTexts.length - 1; i >= 0; i--) {
        const ft = game.floatingTexts[i];
        ft.y -= 38 * dt;
        ft.life -= dt;
        if (ft.life <= 0) game.floatingTexts.splice(i, 1);
      }
    }

    /**
     * 7. RENDERING THE NEON COURT, HOOP, PLAYERS & GREEN EFFECTS
     */
    function drawCourt() {
      const w = game.width;
      const h = game.height;

      const grad = ctx.createLinearGradient(0, 0, 0, h);
      grad.addColorStop(0, '#361059');
      grad.addColorStop(0.35, '#591c87');
      grad.addColorStop(1, '#2d0b4a');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, w, h);

      ctx.strokeStyle = 'rgba(255,255,255,0.06)';
      ctx.lineWidth = 2;
      for (let y = h * 0.22; y < h; y += 26) {
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(w, y);
        ctx.stroke();
      }

      const cx = w * 0.5;
      const topY = h * 0.22;
      const botY = h * 0.93;

      ctx.strokeStyle = '#9eca35';
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.moveTo(w * 0.08, topY);
      ctx.lineTo(w * 0.92, topY);
      ctx.lineTo(w * 0.96, botY);
      ctx.lineTo(w * 0.04, botY);
      ctx.closePath();
      ctx.stroke();

      // Painted Key / Dunk Lane
      const keyTopW = w * 0.18;
      const keyBotW = w * 0.24;
      const keyBotY = h * 0.53;
      ctx.fillStyle = 'rgba(238, 17, 123, 0.36)';
      ctx.beginPath();
      ctx.moveTo(cx - keyTopW / 2, topY);
      ctx.lineTo(cx + keyTopW / 2, topY);
      ctx.lineTo(cx + keyBotW / 2, keyBotY);
      ctx.lineTo(cx - keyBotW / 2, keyBotY);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = '#10ef83';
      ctx.lineWidth = 4;
      ctx.stroke();

      // Dunk Zone Label inside Paint
      ctx.fillStyle = 'rgba(16, 239, 131, 0.72)';
      ctx.font = 'bold 12px Bungee, Fredoka, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('💥 DUNK ZONE', cx, h * 0.39);

      // Free Throw Circle
      ctx.beginPath();
      ctx.ellipse(cx, keyBotY, keyBotW / 2, h * 0.065, 0, 0, Math.PI * 2);
      ctx.strokeStyle = '#10ef83';
      ctx.lineWidth = 4;
      ctx.stroke();

      // Three-Point Arc
      ctx.beginPath();
      ctx.moveTo(w * 0.12, topY);
      ctx.lineTo(w * 0.12, h * 0.43);
      ctx.ellipse(cx, h * 0.37, w * 0.38, h * 0.40, 0, Math.PI, 0, true);
      ctx.lineTo(w * 0.88, topY);
      ctx.strokeStyle = '#10ef83';
      ctx.lineWidth = 5;
      ctx.stroke();

      // Clickable Court Spot Markers
      COURT_SPOTS.forEach((spot, idx) => {
        const sx = spot.x * w;
        const sy = spot.y * h;
        const isCurrent = idx === game.spotIndex;
        ctx.beginPath();
        ctx.ellipse(sx, sy + 12, isCurrent ? 22 : 16, isCurrent ? 10 : 7, 0, 0, Math.PI * 2);
        ctx.fillStyle = isCurrent ? 'rgba(16, 239, 131, 0.42)' : 'rgba(158, 202, 53, 0.22)';
        ctx.fill();
        ctx.strokeStyle = isCurrent ? '#10ef83' : '#9eca35';
        ctx.lineWidth = 2.5;
        ctx.stroke();
      });
    }

    function drawHoop() {
      const hx = HOOP_POS.x * game.width;
      const hy = HOOP_POS.y * game.height;

      ctx.fillStyle = '#180429';
      ctx.fillRect(hx - 8, hy - 58, 16, 65);

      ctx.fillStyle = 'rgba(255, 255, 255, 0.92)';
      ctx.strokeStyle = '#180429';
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.roundRect(hx - 62, hy - 86, 124, 72, 12);
      ctx.fill();
      ctx.stroke();

      ctx.strokeStyle = '#ee117b';
      ctx.lineWidth = 4;
      ctx.strokeRect(hx - 24, hy - 56, 48, 34);

      // Net
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 2.5;
      for (let i = -20; i <= 20; i += 8) {
        ctx.beginPath();
        ctx.moveTo(hx + i, hy - 14);
        ctx.lineTo(hx + i * 0.65, hy + 18);
        ctx.stroke();
      }
      ctx.beginPath();
      ctx.moveTo(hx - 17, hy - 2);
      ctx.lineTo(hx + 17, hy - 2);
      ctx.moveTo(hx - 14, hy + 9);
      ctx.lineTo(hx + 14, hy + 9);
      ctx.stroke();

      // Rim
      ctx.strokeStyle = '#ee117b';
      ctx.lineWidth = 6;
      ctx.beginPath();
      ctx.ellipse(hx, hy - 14, 24, 7, 0, 0, Math.PI * 2);
      ctx.stroke();
    }

    function drawGreenEffectOnTop(px, py, timer) {
      if (timer <= 0) return;

      const pulse = 1 + Math.sin(performance.now() * 0.015) * 0.14;
      const alpha = Math.min(1, timer);

      ctx.save();
      ctx.globalAlpha = alpha;

      const auraGrad = ctx.createRadialGradient(px, py - 45, 5, px, py - 45, 58 * pulse);
      auraGrad.addColorStop(0, 'rgba(16, 239, 131, 0.95)');
      auraGrad.addColorStop(0.55, 'rgba(158, 202, 53, 0.55)');
      auraGrad.addColorStop(1, 'rgba(16, 239, 131, 0)');
      ctx.fillStyle = auraGrad;
      ctx.beginPath();
      ctx.arc(px, py - 45, 58 * pulse, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = '#10ef83';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.ellipse(px, py - 74, 22 * pulse, 7 * pulse, 0, 0, Math.PI * 2);
      ctx.stroke();

      ctx.fillStyle = '#10ef83';
      ctx.strokeStyle = '#180429';
      ctx.lineWidth = 2.5;
      ctx.font = 'bold 14px Bungee, Fredoka, sans-serif';
      ctx.textAlign = 'center';
      ctx.strokeText('💚 GREEN! 💚', px, py - 88);
      ctx.fillText('💚 GREEN! 💚', px, py - 88);

      ctx.restore();
    }

    function drawPlayer(normX, normY, jumpOffset, jerseyColor, numberText, labelText, greenTimer, isCalling, playerVariant = 'user') {
      const px = normX * game.width;
      const py = normY * game.height - jumpOffset;
      const groundY = normY * game.height + 14;

      // Ground Shadow
      ctx.fillStyle = 'rgba(0, 0, 0, 0.35)';
      ctx.beginPath();
      ctx.ellipse(px, groundY, 22, 8, 0, 0, Math.PI * 2);
      ctx.fill();

      // Green Aura & Crown Effect on top of shooter
      drawGreenEffectOnTop(px, py, greenTimer);

      // Legs
      ctx.strokeStyle = '#180429';
      ctx.lineWidth = 6;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(px - 7, py - 8);
      ctx.lineTo(px - 10, py + 12);
      ctx.moveTo(px + 7, py - 8);
      ctx.lineTo(px + 10, py + 12);
      ctx.stroke();

      // Jersey Torso
      ctx.fillStyle = jerseyColor;
      ctx.strokeStyle = '#180429';
      ctx.lineWidth = 3.5;
      ctx.beginPath();
      ctx.roundRect(px - 15, py - 34, 30, 28, 8);
      ctx.fill();
      ctx.stroke();

      // Jersey Number
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 13px Bungee, Fredoka, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(numberText, px, py - 15);

      // Arms (raised when calling for pass or jumping!)
      const armUp = isCalling || jumpOffset > 5;
      ctx.strokeStyle = '#f4b183';
      ctx.lineWidth = 5;
      ctx.beginPath();
      ctx.moveTo(px - 15, py - 28);
      ctx.lineTo(px - 24, armUp ? py - 50 : py - 14);
      ctx.moveTo(px + 15, py - 28);
      ctx.lineTo(px + 24, armUp ? py - 50 : py - 14);
      ctx.stroke();

      // Head
      ctx.fillStyle = playerVariant === 'curry' ? '#e5a478' : '#d89262';
      ctx.strokeStyle = '#180429';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(px, py - 46, 13, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      // Signature Hair / Headband Details
      if (playerVariant === 'curry') {
        // Stephen Curry curly fade & beard
        ctx.fillStyle = '#180429';
        ctx.beginPath();
        ctx.arc(px, py - 53, 12, Math.PI, 0);
        ctx.fill();
        ctx.strokeStyle = '#180429';
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.arc(px, py - 45, 9, 0.25 * Math.PI, 0.75 * Math.PI);
        ctx.stroke();
      } else if (playerVariant === 'wade') {
        // Dwyane Wade headband & fade
        ctx.fillStyle = '#180429';
        ctx.beginPath();
        ctx.arc(px, py - 54, 11, Math.PI, 0);
        ctx.fill();
        ctx.strokeStyle = '#ee117b';
        ctx.lineWidth = 3.5;
        ctx.beginPath();
        ctx.moveTo(px - 12, py - 51);
        ctx.lineTo(px + 12, py - 51);
        ctx.stroke();
      } else {
        // User Neon Headband
        ctx.strokeStyle = '#10ef83';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.moveTo(px - 12, py - 50);
        ctx.lineTo(px + 12, py - 50);
        ctx.stroke();
      }

      // Name Badge under player
      ctx.fillStyle = '#180429';
      ctx.beginPath();
      ctx.roundRect(px - 42, groundY + 4, 84, 18, 8);
      ctx.fill();
      ctx.fillStyle = '#10ef83';
      ctx.font = 'bold 10px Fredoka, sans-serif';
      ctx.fillText(labelText, px, groundY + 16);
    }

    function drawLeBronDefender() {
      if (!game.opponent.active) return;

      const px = game.opponent.x * game.width;
      const py = game.opponent.y * game.height - game.opponent.jumpOffset;
      const groundY = game.opponent.y * game.height + 15;
      const isStunned = game.opponent.stunnedTimer > 0;

      // Ground Shadow
      ctx.fillStyle = 'rgba(0, 0, 0, 0.4)';
      ctx.beginPath();
      ctx.ellipse(px, groundY, isStunned ? 34 : 24, 9, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.save();
      if (isStunned) {
        // Stunned on the ground sideways!
        ctx.translate(px, groundY - 8);
        ctx.rotate(Math.PI / 2.2);
        ctx.translate(-px, -(groundY - 8));
      }

      // Legs
      ctx.strokeStyle = '#180429';
      ctx.lineWidth = 6.5;
      ctx.lineCap = 'round';
      ctx.beginPath();
      ctx.moveTo(px - 8, py - 8);
      ctx.lineTo(px - 12, py + 14);
      ctx.moveTo(px + 8, py - 8);
      ctx.lineTo(px + 12, py + 14);
      ctx.stroke();

      // Gold & Purple #23 Jersey
      ctx.fillStyle = '#f5b800';
      ctx.strokeStyle = '#8b16e9';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.roundRect(px - 17, py - 37, 34, 30, 8);
      ctx.fill();
      ctx.stroke();

      ctx.fillStyle = '#8b16e9';
      ctx.font = 'bold 13px Bungee, Fredoka, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('23', px, py - 17);

      // Contesting Arms
      const contestArms = game.ball.state === 'aiming' || game.opponent.jumpOffset > 4 || game.opponent.blockAnimTimer > 0;
      ctx.strokeStyle = '#6e4228';
      ctx.lineWidth = 5.5;
      ctx.beginPath();
      ctx.moveTo(px - 17, py - 30);
      ctx.lineTo(px - 26, contestArms ? py - 56 : py - 15);
      ctx.moveTo(px + 17, py - 30);
      ctx.lineTo(px + 26, contestArms ? py - 56 : py - 15);
      ctx.stroke();

      // Head & Signature Beard + Headband
      ctx.fillStyle = '#6e4228';
      ctx.strokeStyle = '#180429';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(px, py - 50, 14, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      // Beard
      ctx.fillStyle = '#180429';
      ctx.beginPath();
      ctx.arc(px, py - 47, 13.5, 0.15 * Math.PI, 0.85 * Math.PI);
      ctx.fill();

      // Crown / Headband
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 3.5;
      ctx.beginPath();
      ctx.moveTo(px - 13, py - 55);
      ctx.lineTo(px + 13, py - 55);
      ctx.stroke();

      ctx.restore();

      // Dizzy Stars when Stunned
      if (isStunned) {
        const spin = performance.now() * 0.008;
        ctx.fillStyle = '#10ef83';
        ctx.font = 'bold 14px Fredoka, sans-serif';
        ctx.textAlign = 'center';
        ctx.fillText('💫 😵 💫', px + Math.cos(spin) * 10, groundY - 28);
      }

      // Label Badge
      ctx.fillStyle = isStunned ? '#ee117b' : '#180429';
      ctx.beginPath();
      ctx.roundRect(px - 48, groundY + 4, 96, 18, 8);
      ctx.fill();
      ctx.fillStyle = '#ffffff';
      ctx.font = 'bold 10px Fredoka, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(isStunned ? 'STUNNED! 💫' : '👑 LEBRON #23', px, groundY + 16);
    }

    function drawBall() {
      const bx = game.ball.x * game.width;
      const groundY = game.ball.y * game.height + 12;
      const by = game.ball.y * game.height - game.ball.z;

      const shadowScale = Math.max(0.35, 1 - game.ball.z / 260);
      ctx.fillStyle = 'rgba(0, 0, 0, 0.38)';
      ctx.beginPath();
      ctx.ellipse(bx, groundY, 13 * shadowScale, 5 * shadowScale, 0, 0, Math.PI * 2);
      ctx.fill();

      if (game.ball.state === 'idle' || game.ball.state === 'dribbling') {
        const pulse = 18 + Math.sin(performance.now() * 0.008) * 3;
        ctx.strokeStyle = '#10ef83';
        ctx.lineWidth = 2.5;
        ctx.setLineDash([4, 4]);
        ctx.beginPath();
        ctx.arc(bx, by, pulse, 0, Math.PI * 2);
        ctx.stroke();
        ctx.setLineDash([]);
      }

      ctx.fillStyle = '#ff6b1a';
      ctx.strokeStyle = '#180429';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.arc(bx, by, 13, 0, Math.PI * 2);
      ctx.fill();
      ctx.stroke();

      ctx.strokeStyle = '#180429';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(bx - 12, by);
      ctx.lineTo(bx + 12, by);
      ctx.moveTo(bx, by - 12);
      ctx.lineTo(bx, by + 12);
      ctx.stroke();
    }

    function drawShotTimingMeter() {
      if (!game.meter.active) return;

      const px = game.player.x * game.width;
      const py = game.player.y * game.height - game.player.jumpOffset - 108;
      const barW = 148;
      const barH = 22;
      const left = Math.max(16, Math.min(game.width - barW - 16, px - barW / 2));
      const top = Math.max(20, py);

      // Meter Backdrop
      ctx.fillStyle = '#180429';
      ctx.strokeStyle = '#ffffff';
      ctx.lineWidth = 3.5;
      ctx.beginPath();
      ctx.roundRect(left - 4, top - 4, barW + 8, barH + 8, 12);
      ctx.fill();
      ctx.stroke();

      // Red/Purple Miss Track
      ctx.fillStyle = '#ee117b';
      ctx.beginPath();
      ctx.roundRect(left, top, barW, barH, 8);
      ctx.fill();

      // GREEN Sweet Spot Section
      const greenX = left + game.meter.greenStart * barW;
      const greenW = (game.meter.greenEnd - game.meter.greenStart) * barW;
      ctx.fillStyle = '#10ef83';
      ctx.fillRect(greenX, top, greenW, barH);

      // Moving Timing Needle
      const needleX = left + game.meter.pos * barW;
      ctx.fillStyle = '#ffffff';
      ctx.strokeStyle = '#180429';
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.roundRect(needleX - 4, top - 5, 8, barH + 10, 4);
      ctx.fill();
      ctx.stroke();

      // Prompt Label
      ctx.fillStyle = '#10ef83';
      ctx.font = 'bold 11px Bungee, Fredoka, sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('RELEASE IN GREEN [E]!', left + barW / 2, top - 9);
    }

    function drawParticlesAndTexts() {
      game.particles.forEach((p) => {
        ctx.save();
        ctx.globalAlpha = Math.max(0, p.life / p.maxLife);
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      });

      game.floatingTexts.forEach((ft) => {
        ctx.save();
        ctx.globalAlpha = Math.min(1, ft.life / ft.maxLife);
        ctx.font = 'bold 14px Bungee, Fredoka, sans-serif';
        ctx.textAlign = 'center';
        ctx.strokeStyle = '#180429';
        ctx.lineWidth = 4;
        ctx.strokeText(ft.text, ft.x, ft.y);
        ctx.fillStyle = ft.color;
        ctx.fillText(ft.text, ft.x, ft.y);
        ctx.restore();
      });
    }

    /**
     * 8. MAIN ANIMATION LOOP & EVENT LISTENERS
     */
    let lastTime = 0;
    function renderLoop(timestamp) {
      if (!lastTime) lastTime = timestamp;
      const dt = Math.min((timestamp - lastTime) / 1000, 0.05);
      lastTime = timestamp;

      update(dt);

      ctx.clearRect(0, 0, game.width, game.height);
      drawCourt();
      drawHoop();

      // Corner Defender: Dwyane Wade (#3) with hands-up contest animation
      const wadeHandsUp = game.wade.handsUpTimer > 0 || game.wade.jumpOffset > 2 || game.wade.blockAnimTimer > 0;
      drawPlayer(
        game.wade.x,
        game.wade.y,
        game.wade.jumpOffset,
        '#ee117b',
        '3',
        wadeHandsUp ? '🙌 D-WADE #3' : 'D-WADE #3',
        0,
        wadeHandsUp,
        'wade'
      );

      // Corner Teammate: Stephen Curry (#30)
      drawPlayer(
        game.cornerPlayer.x,
        game.cornerPlayer.y,
        game.cornerPlayer.jumpOffset,
        '#1d4ed8',
        '30',
        'CURRY #30',
        game.cornerPlayer.greenEffectTimer,
        game.cornerPlayer.callingTimer > 0,
        'curry'
      );

      // Opponent Defender: LeBron James (#23)
      drawLeBronDefender();

      // Main User Player
      drawPlayer(
        game.player.x,
        game.player.y,
        game.player.jumpOffset,
        '#8b16e9',
        '1',
        'YOU #1',
        game.player.greenEffectTimer,
        false,
        'user'
      );

      drawBall();
      drawShotTimingMeter();
      drawParticlesAndTexts();

      requestAnimationFrame(renderLoop);
    }

    function handleCourtInteraction(clientX, clientY) {
      initAudio();
      const rect = canvas.getBoundingClientRect();
      const clickX = clientX - rect.left;
      const clickY = clientY - rect.top;

      // If shot meter is active, tapping anywhere releases the shot!
      if (game.ball.state === 'aiming') {
        releaseTimedShot();
        return;
      }

      // Check if user clicked on the Basketball
      const bx = game.ball.x * game.width;
      const by = game.ball.y * game.height - game.ball.z;
      if (Math.hypot(clickX - bx, clickY - by) <= 44) {
        triggerDribbleMove('crossover');
        showBallMenu();
        return;
      }

      // Check if user clicked on Stephen Curry in the corner -> Pass!
      const cx = game.cornerPlayer.x * game.width;
      const cy = game.cornerPlayer.y * game.height - 25;
      if (Math.hypot(clickX - cx, clickY - cy) <= 48) {
        triggerPassToCorner();
        return;
      }

      // Otherwise, hide menu and move player to tapped court spot
      if (!radialMenu.classList.contains('hidden')) {
        hideBallMenu();
        return;
      }

      if (game.ball.state === 'idle' || game.ball.state === 'dribbling') {
        const normX = Math.max(0.12, Math.min(0.88, clickX / game.width));
        const normY = Math.max(0.24, Math.min(0.87, clickY / game.height));
        game.player.targetX = normX;
        game.player.targetY = normY;
        game.player.hasTarget = true;
        updateShootButtonUI();
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      resizeCanvas();
      updateScoreboard();
      updateShootButtonUI();

      window.addEventListener('resize', resizeCanvas);

      canvas.addEventListener('click', (e) => {
        handleCourtInteraction(e.clientX, e.clientY);
      });

      // Hotbar & Radial Menu Buttons
      document.getElementById('menu-crossover-btn').addEventListener('click', (e) => {
        e.stopPropagation();
        triggerDribbleMove('crossover');
      });
      document.getElementById('menu-between-btn').addEventListener('click', (e) => {
        e.stopPropagation();
        triggerDribbleMove('between-legs');
      });
      document.getElementById('menu-behind-btn').addEventListener('click', (e) => {
        e.stopPropagation();
        triggerDribbleMove('behind-back');
      });
      document.getElementById('menu-shoot-btn').addEventListener('click', (e) => {
        e.stopPropagation();
        startOrReleaseShot();
      });
      document.getElementById('menu-pass-btn').addEventListener('click', (e) => {
        e.stopPropagation();
        triggerPassToCorner();
      });

      document.getElementById('hotbar-crossover-btn').addEventListener('click', () => triggerDribbleMove('crossover'));
      document.getElementById('hotbar-between-btn').addEventListener('click', () => triggerDribbleMove('between-legs'));
      document.getElementById('hotbar-behind-btn').addEventListener('click', () => triggerDribbleMove('behind-back'));
      document.getElementById('hotbar-shoot-btn').addEventListener('click', startOrReleaseShot);
      document.getElementById('hotbar-pass-btn').addEventListener('click', triggerPassToCorner);

      // Court Spot Buttons
      document.querySelectorAll('.spot-btn').forEach((btn) => {
        btn.addEventListener('click', () => {
          const idx = parseInt(btn.getAttribute('data-spot'), 10);
          selectSpot(idx);
        });
      });

      // Top Header Hotbar Controls
      document.getElementById('opponents-btn').addEventListener('click', toggleOpponents);

      document.getElementById('sound-btn').addEventListener('click', () => {
        soundEnabled = !soundEnabled;
        document.getElementById('sound-icon').textContent = soundEnabled ? '🔊' : '🔇';
        if (soundEnabled) {
          initAudio();
          playSound('zap');
        }
      });

      document.getElementById('zap-btn').addEventListener('click', () => {
        const body = document.getElementById('app-body');
        body.classList.remove('screen-zap');
        void body.offsetWidth;
        body.classList.add('screen-zap');
        playSound('zap');
      });

      // Keyboard Controls: WASD/Arrows Move, Q=Crossover, C=Between Legs, X=Behind Back, E=Shoot/Dunk
      window.addEventListener('keydown', (e) => {
        keysPressed[e.code] = true;
        if (['ArrowUp', 'ArrowDown', 'ArrowLeft', 'ArrowRight', 'Space'].includes(e.code)) {
          e.preventDefault();
        }
        if (e.repeat) return;

        if (e.code === 'KeyQ') triggerDribbleMove('crossover');
        if (e.code === 'KeyC') triggerDribbleMove('between-legs');
        if (e.code === 'KeyX') triggerDribbleMove('behind-back');
        if (e.code === 'KeyE' || e.code === 'Space') startOrReleaseShot();
        if (e.code === 'KeyP') triggerPassToCorner();
      });

      window.addEventListener('keyup', (e) => {
        keysPressed[e.code] = false;
      });

      requestAnimationFrame(renderLoop);
    });
  </script>
</body>
</html>
